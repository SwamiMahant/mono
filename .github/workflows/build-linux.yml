name: Build Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r Linux/requirements.txt
      - name: Syntax check
        run: python -m py_compile Linux/capture.py Linux/webapp.py
